async function copyToClipboard(value) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(value); return true; }
  } catch (e) { /* fall through */ }
  try {
    const area = document.createElement("textarea");
    area.value = value; area.setAttribute("readonly", "");
    area.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(area); area.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(area);
    return ok;
  } catch (e) { return false; }
}

function scrollToSection(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const top = el.getBoundingClientRect().top + window.scrollY - 78;
  window.scrollTo({ top, behavior: reduce ? "auto" : "smooth" });
  try {
    const p = window.location.protocol;
    if ((p === "https:" || p === "http:") && window.history.replaceState) window.history.replaceState(null, "", "#" + id);
  } catch (e) { /* shareable URL is a nicety, never a failure mode */ }
}

/** IntersectionObserver-based reveal (replaces framer-motion whileInView). */
function useInView() {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const node = ref.current;
    if (!node) return undefined;
    if (typeof IntersectionObserver === "undefined") { setSeen(true); return undefined; }
    const io = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) { setSeen(true); io.disconnect(); }
    }, { rootMargin: "-70px 0px -70px 0px", threshold: 0 });
    io.observe(node);
    return () => io.disconnect();
  }, []);
  return [ref, seen];
}

function Reveal(props) {
  const delay = props.delay || 0;
  const className = props.className || "";
  const Tag = props.as || "div";
  const pair = useInView();
  const ref = pair[0], seen = pair[1];
  return (
    <Tag ref={ref} className={"rv " + (seen ? "rv-in " : "") + className} style={{ transitionDelay: delay + "s" }}>
      {props.children}
    </Tag>
  );
}

function ScrambleText(props) {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const text = props.text;
  const pair = useState(reduce ? text : "");
  const output = pair[0], setOutput = pair[1];
  const timer = useRef(0); const frame = useRef(0);
  useEffect(() => {
    if (reduce) { setOutput(text); return undefined; }
    const glyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ/\\<>_+*#0123456789";
    const total = text.length * 3 + 12;
    const tick = () => {
      frame.current += 1;
      const revealed = Math.floor((frame.current / total) * text.length * 1.35);
      let next = "";
      for (let i = 0; i < text.length; i += 1) {
        const ch = text[i];
        if (ch === " ") next += " ";
        else if (i < revealed) next += ch;
        else next += glyphs[Math.floor(Math.random() * glyphs.length)];
      }
      setOutput(next);
      if (frame.current < total) timer.current = window.setTimeout(tick, props.speed || 34);
      else setOutput(text);
    };
    timer.current = window.setTimeout(tick, props.startDelay || 120);
    return () => window.clearTimeout(timer.current);
  }, [text, reduce]);
  return <span className={props.className} aria-label={text}><span aria-hidden="true">{output || "\u00A0"}</span></span>;
}

function Crosshair() {
  const host = useRef(null); const vLine = useRef(null); const hLine = useRef(null); const readout = useRef(null);
  useEffect(() => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return undefined;
    if (window.matchMedia("(pointer: coarse)").matches) return undefined;
    const node = host.current; if (!node) return undefined;
    let pending = 0, x = 0, y = 0;
    const paint = () => {
      pending = 0;
      if (vLine.current) vLine.current.style.transform = "translate3d(" + x + "px,0,0)";
      if (hLine.current) hLine.current.style.transform = "translate3d(0," + y + "px,0)";
      if (readout.current) readout.current.textContent = "X " + String(Math.round(x)).padStart(4, "0") + " · Y " + String(Math.round(y)).padStart(4, "0");
    };
    const onMove = (event) => {
      const rect = node.getBoundingClientRect();
      x = event.clientX - rect.left; y = event.clientY - rect.top;
      if (!pending) pending = window.requestAnimationFrame(paint);
    };
    node.addEventListener("pointermove", onMove, { passive: true });
    return () => { node.removeEventListener("pointermove", onMove); if (pending) window.cancelAnimationFrame(pending); };
  }, []);
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return null;
  return (
    <div ref={host} className="no-print pointer-events-none absolute inset-0 z-20 hidden lg:block">
      <div ref={vLine} className="absolute top-0 h-full w-px opacity-40" style={{ background: "linear-gradient(to bottom,transparent,var(--blue),transparent)" }} />
      <div ref={hLine} className="absolute left-0 h-px w-full opacity-40" style={{ background: "linear-gradient(to right,transparent,var(--blue),transparent)" }} />
      <span ref={readout} className="f-mono absolute right-6 bottom-6 text-[10px] tracking-[.18em] text-[var(--muted)]" />
    </div>
  );
}

function ScrollProgress() {
  const ref = useRef(null);
  useEffect(() => {
    const on = () => {
      const h = document.documentElement;
      const p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
      if (ref.current) ref.current.style.transform = "scaleX(" + p + ")";
    };
    on();
    window.addEventListener("scroll", on, { passive: true });
    return () => window.removeEventListener("scroll", on);
  }, []);
  return <div ref={ref} className="no-print fixed top-0 left-0 z-[70] h-[2px] w-full origin-left" style={{ background: "var(--amber)", transform: "scaleX(0)" }} aria-hidden="true" />;
}

function useActiveSection() {
  const pair = useState("profile");
  const active = pair[0], setActive = pair[1];
  useEffect(() => {
    const nodes = NAV.map((i) => document.getElementById(i.id)).filter(Boolean);
    if (!nodes.length || typeof IntersectionObserver === "undefined") return undefined;
    const io = new IntersectionObserver((entries) => {
      const visible = entries.filter((e) => e.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (visible) setActive(visible.target.id);
    }, { rootMargin: "-45% 0px -50% 0px", threshold: [0, 0.2, 0.6, 1] });
    nodes.forEach((n) => io.observe(n));
    return () => io.disconnect();
  }, []);
  return active;
}

  useEffect(() => () => window.clearTimeout(copyTimer.current), []);
  const onCopy = useCallback(async () => {
    const ok = await copyToClipboard(CV.contact.email);
    setCopied(ok);
    window.clearTimeout(copyTimer.current);

  }, []);

  const tickerItems = useMemo(() => [
    ...UTT_REGISTER.map((e) => e.title),
    ...CV.education.subjects.map((s) => s.name),
    ...CV.training.modules.map((m) => m.name),

  return (
    <section id="home" className="relative isolate overflow-hidden pt-[62px]" aria-labelledby="hero-title">

            </span>
          </Reveal>

          <h1 id="hero-title" className="m-0">
            <span className="sr-only">{CV.name.first + " " + CV.name.last}</span>
            <span aria-hidden="true" className="block">
              <ScrambleText text={CV.name.first.toUpperCase()} speed={30} startDelay={180}
                className="f-display block text-[clamp(3.4rem,14.5vw,12rem)] leading-[0.82] tracking-[-0.03em] text-[var(--ink)]" />
              <span className="f-display outline -mt-[0.06em] block text-[clamp(3.4rem,14.5vw,12rem)] leading-[0.82] tracking-[-0.03em]">{CV.name.last.toUpperCase()}</span>
            </span>
          </h1>

          <Reveal delay={0.85} className="mt-9 flex flex-wrap items-center gap-x-5 gap-y-3">
            <span className="h-px w-14" style={{ background: "var(--amber)" }} aria-hidden="true"></span>
            <p className="f-mono text-[11px] uppercase tracking-[.22em] text-[var(--ink-2)]">{TOTAL_COURSES} courses · all completed</p>
          </Reveal>

          <Reveal delay={1} className="mt-7 max-w-[58ch] border-l pl-5 text-[15.5px] leading-[1.78] text-[var(--ink-2)]" >
            <p className="m-0" style={{ borderColor: "var(--line)" }}>{ADDENDUM.summary}</p>
          </Reveal>

          <Reveal delay={1.12} className="mt-9 flex flex-wrap items-center gap-3">
            <ActionButton onClick={() => scrollToSection("contact")} ariaLabel="Jump to contact details">Get in touch <Icon name="arrow" size={14} /></ActionButton>
            <ActionButton onClick={onCopy} ariaLabel={"Copy email address " + CV.contact.email}>
              <Icon name={copied ? "check" : "copy"} size={14} />{copied ? "Copied" : "Copy email"}
            </ActionButton>
            <ActionButton variant="ghost" href={CV.contact.portfolioUrl} external ariaLabel="Open portfolio site in a new tab">Portfolio <Icon name="external" size={13} /></ActionButton>
            <span role="status" aria-live="polite" className="sr-only">{copied ? "Email address copied to clipboard." : ""}</span>
          </Reveal>
        </div>

        <Reveal delay={0.5}>
          <aside className="sheet brk self-start" aria-label="Contact title block">
            <div className="flex items-center justify-between border-b px-4 py-2.5" style={{ borderColor: "var(--line)", background: "var(--surface-2)" }}>
              <span className="lbl text-[var(--amber)]">Title block</span><span className="lbl">Sheet 01 / 07</span>
            </div>
            <DataRow label="Name">{CV.name.first + " " + CV.name.last}</DataRow>
            <DataRow label="Programme" accent>{ADDENDUM.current.programme} — UTT · {ADDENDUM.current.status}</DataRow>
            <DataRow label="Location">{CV.contact.location}</DataRow>
            <DataRow label="Email" accent><a className="ul hover:text-[var(--amber)]" href={"mailto:" + CV.contact.email}>{CV.contact.email}</a></DataRow>
            <DataRow label="Phone"><a className="ul hover:text-[var(--amber)]" href={CV.contact.phoneHref}>{CV.contact.phoneDisplay}</a></DataRow>
            <button type="button" onClick={() => scrollToSection("contact")}

              style={{ borderColor: "var(--line)", background: "var(--surface-2)" }}
              aria-label="Jump to the full record and all contact channels">
              <span className="lbl">Full record &amp; channels</span>
              <span className="flex items-center gap-2 f-mono text-[10px] uppercase tracking-[.18em] transition-transform duration-300 group-hover:translate-y-0.5" style={{ color: "var(--amber)" }}>
                Contact <Icon name="down" size={12} />
              </span>
            </button>
          </aside>
        </Reveal>
      </div>

      <div className="relative border-y py-3" style={{ borderColor: "var(--line)", background: "var(--bg-alt)" }}>
        <div className="mq-host mq-mask overflow-hidden">
          <div className="mq">
            {[0, 1].map((dup) => (
              <div key={dup} className="flex shrink-0 items-center" aria-hidden={dup === 1}>
                {tickerItems.map((item, i) => (
                  <span key={dup + "-" + item} className="flex items-center">
                    <span className="f-mono px-6 text-[11px] uppercase tracking-[.2em] whitespace-nowrap text-[var(--muted)]">{item}</span>
                    <span className="h-1 w-1 shrink-0 rotate-45" style={{ background: i % 3 === 0 ? "var(--amber)" : "var(--line)" }} />
                  </span>
                ))}
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

                  {CV.projects.skillsDeveloped.map((skill, i) => (
                    <Reveal as="li" key={skill} delay={i * 0.06} className="flex items-center gap-3 border-b py-3 last:border-b-0" style={{ borderColor: "var(--line-soft)" }}>

                      <span className="text-[14px] text-[var(--ink-2)]">{skill}</span>
                    </Reveal>
                  ))}
                </ul>
              </div>
            </div>
          </article>
        </Reveal>
      </div>
    </section>
  );
}

function ContactSection() {
  const sPair = useState("idle"); const status = sPair[0], setStatus = sPair[1];
  const lPair = useState(""); const lastCopied = lPair[0], setLastCopied = lPair[1];
  const timer = useRef(0);
  useEffect(() => () => window.clearTimeout(timer.current), []);
  const handleCopy = useCallback(async (value, label) => {
    const ok = await copyToClipboard(value);
    setLastCopied(label); setStatus(ok ? "copied" : "error");
    window.clearTimeout(timer.current);
    timer.current = window.setTimeout(() => setStatus("idle"), 2400);
  }, []);

  const channels = [
    { label: "Email", value: CV.contact.email, href: "mailto:" + CV.contact.email, icon: "mail" },
    { label: "Phone", value: CV.contact.phoneDisplay, href: CV.contact.phoneHref, icon: "phone" },
    { label: "Instagram", value: CV.contact.instagramHandle, href: CV.contact.instagramUrl, icon: "camera", external: true },
    { label: "Portfolio", value: CV.contact.portfolioLabel, href: CV.contact.portfolioUrl, icon: "external", external: true },
  ];

  return (
    <section id="contact" className="relative scroll-mt-24 overflow-hidden border-t py-20 md:py-28" style={{ borderColor: "var(--line)", background: "var(--bg-alt)" }} aria-labelledby="contact-h">
      <div className="blueprint absolute inset-0 opacity-60" aria-hidden="true"></div>
      <div className="relative mx-auto max-w-[1400px] px-5 sm:px-8">
        <SectionHeader index="07" kicker="Get in touch" title="Contact" id="contact-h" />
        <div className="grid gap-10 lg:grid-cols-[minmax(0,1.05fr)_minmax(0,1fr)] lg:gap-16">
          <Reveal>
            <p className="f-display m-0 text-[clamp(1.55rem,3.4vw,2.5rem)] leading-[1.2]">{ADDENDUM.contactLead}</p>
            <div className="mt-8 flex flex-wrap gap-3">
              <ActionButton href={"mailto:" + CV.contact.email} ariaLabel={"Send an email to " + CV.contact.email}><Icon name="mail" size={14} /> Email me</ActionButton>
              <ActionButton variant="ghost" href={CV.contact.phoneHref} ariaLabel={"Call " + CV.contact.phoneDisplay}><Icon name="phone" size={14} /> Call</ActionButton>
              <ActionButton variant="ghost" href={CV.contact.instagramUrl} external ariaLabel={"Open Instagram profile " + CV.contact.instagramHandle + " in a new tab"}><Icon name="camera" size={14} /> Instagram</ActionButton>
              <ActionButton variant="ghost" onClick={() => window.print()} ariaLabel="Print this page or save it as a PDF"><Icon name="print" size={14} /> Print / Save PDF</ActionButton>
            </div>
            <div className="mt-10">
              <div className="flex items-baseline justify-between gap-4 border-b px-4 py-3" style={{ borderColor: "var(--line)", background: "var(--surface-2)" }}>
                <span className="lbl text-[var(--amber)]">Record</span><span className="lbl">{String(RECORD_CELLS.length).padStart(2, "0")} entries</span>
              </div>
              <dl className="m-0 grid grid-cols-1 gap-px sm:grid-cols-2" style={{ background: "var(--line-soft)" }}>
                {RECORD_CELLS.map((cell) => (
                  <div key={cell.label} className="px-4 py-4" style={{ background: "var(--surface)" }}>
                    <dt className="lbl mb-2">{cell.label}</dt>
                    <dd className="m-0 f-mono text-[12.5px] leading-[1.6] break-words text-[var(--ink-2)]">{cell.value}</dd>
                  </div>
                ))}
              </dl>
            </div>
            <div className="sheet mt-8 p-5" style={{ background: "var(--surface)" }}>
              <p className="lbl mb-4">Source notes — outstanding items</p>
              <ul className="m-0 list-none space-y-2.5 p-0">
                {SOURCE_GAPS.map((gap) => (
                  <li key={gap.field} className="grid grid-cols-[minmax(118px,168px)_minmax(0,1fr)] gap-3">
                    <span className="f-mono text-[11px] tracking-[.08em] text-[var(--muted)]">{gap.field}</span>
                    <span className="f-mono text-[11px] break-words" style={{ color: gap.value.charAt(0) === "[" ? "var(--red)" : "var(--ink-2)", fontStyle: gap.value.charAt(0) === "[" ? "italic" : "normal" }}>{gap.value}</span>
                  </li>
                ))}
              </ul>
            </div>
          </Reveal>
          <Reveal delay={0.08}>
            <p className="lbl mb-4">Channels</p>
            <ul className="m-0 list-none space-y-px p-0" style={{ background: "var(--line-soft)" }}>
              {channels.map((channel) => (
                <li key={channel.label} className="m-0">
                  <div className="group flex items-center gap-4 px-5 py-5 transition-colors duration-300 hover:bg-[var(--surface-2)]" style={{ background: "var(--surface)" }}>
                    <span className="grid h-9 w-9 shrink-0 place-items-center border transition-colors duration-300 group-hover:border-[var(--amber)]" style={{ borderColor: "var(--line)", color: "var(--blue)" }} aria-hidden="true"><Icon name={channel.icon} size={15} /></span>
                    <span className="min-w-0 flex-1">
                      <span className="lbl block">{channel.label}</span>
                      <a className="ul f-mono mt-1 block text-[13px] break-words text-[var(--ink)]" href={channel.href} {...(channel.external ? { target: "_blank", rel: "noopener noreferrer" } : {})}>{channel.value}</a>
                    </span>
                    <button type="button" onClick={() => handleCopy(channel.value, channel.label)}
                      className="grid h-8 w-8 shrink-0 place-items-center border transition-colors duration-300 hover:border-[var(--amber)] hover:text-[var(--amber)]"
                      style={{ borderColor: "var(--line)", color: "var(--muted)" }} aria-label={"Copy " + channel.label.toLowerCase()}>
                      <Icon name="copy" size={13} />
                    </button>
                  </div>
                </li>
              ))}
            </ul>
            <p role="status" aria-live="polite" className="lbl mt-4 min-h-[16px]">
              {status === "copied" ? lastCopied + " copied to clipboard" : status === "error" ? "Copy unavailable — please select the text manually" : ""}
            </p>
            <div className="sheet brk mt-6 flex items-center justify-between gap-4 px-5 py-4" style={{ background: "var(--surface)" }}>
              <span className="lbl">References</span><span className="f-mono text-[12.5px] text-[var(--ink-2)]">{CV.references}</span>
            </div>
            <div className="sheet mt-5 px-5 py-4" style={{ background: "var(--surface)" }}>
              <span className="lbl block mb-2">Based in</span>
              <span className="flex items-center gap-2 f-mono text-[12.5px] text-[var(--ink-2)]"><Icon name="pin" size={13} />{CV.contact.location}</span>
            </div>
          </Reveal>
        </div>
      </div>
    </section>
  );
}

          <a className="ul f-mono text-[11px] uppercase tracking-[.18em] text-[var(--muted)] hover:text-[var(--ink)]" href={CV.contact.instagramUrl} target="_blank" rel="noopener noreferrer">Instagram</a>
          <a className="ul f-mono text-[11px] uppercase tracking-[.18em] text-[var(--muted)] hover:text-[var(--ink)]" href={"mailto:" + CV.contact.email}>Email</a>
          <button type="button" onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
            className="no-print group inline-flex items-center gap-2 border px-3 py-2 f-mono text-[10px] uppercase tracking-[.18em] transition-colors duration-300 hover:border-[var(--amber)] hover:text-[var(--amber)]"
            style={{ borderColor: "var(--line)", color: "var(--muted)" }} aria-label="Scroll back to top of page">
            <Icon name="up" size={12} /> Top
          </button>
        </div>
      </div>
      <div className="border-t px-5 py-4 sm:px-8" style={{ borderColor: "var(--line-soft)", background: "var(--bg-alt)" }}>
        <p className="mx-auto m-0 max-w-[1400px] f-mono text-[10px] uppercase tracking-[.18em] text-[var(--muted)]">Content from Aidan_Suraj_CV.pdf + client addendum + UTT course table · No data invented</p>
      </div>
    </footer>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   8. APP
   ═══════════════════════════════════════════════════════════════════════════ */

const THEME_KEY = "as-theme-preference";
function readInitialTheme() {
  try { const s = window.localStorage.getItem(THEME_KEY); if (s === "light" || s === "dark") return s; } catch (e) { /* private mode */ }
  try { return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; } catch (e) { return "dark"; }
}

function App() {
  const tPair = useState(readInitialTheme);
  const theme = tPair[0], setTheme = tPair[1];

  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    try { window.localStorage.setItem(THEME_KEY, theme); } catch (e) { /* non-fatal */ }
  }, [theme]);

  const toggleTheme = useCallback(() => setTheme((c) => (c === "dark" ? "light" : "dark")), []);

  /* Runtime canonical URL — correct on user.github.io and on /repo/ alike. */
  useLayoutEffect(() => {
    let link = document.head.querySelector('link[rel="canonical"]');
    if (!link) { link = document.createElement("link"); link.rel = "canonical"; document.head.appendChild(link); }
    try { link.href = window.location.origin + window.location.pathname; } catch (e) { /* leave empty */ }
  }, []);

  /* Hash deep-links: resolved client-side, so static hosts never 404. */
  useEffect(() => {
    const hash = window.location.hash.replace("#", "");
    if (hash && NAV.some((i) => i.id === hash)) window.setTimeout(() => scrollToSection(hash), 260);
  }, []);

  return (
    <React.Fragment>
      <Grain />
      <div className="vignette no-print" aria-hidden="true"></div>
      <ScrollProgress />
      <a href="#profile"
        className="no-print sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[80] focus:border focus:border-[var(--amber)] focus:bg-[var(--surface)] focus:px-4 focus:py-2 focus:f-mono focus:text-[11px] focus:uppercase focus:tracking-[.18em] focus:text-[var(--ink)]"
        onClick={(e) => { e.preventDefault(); scrollToSection("profile"); }}>
        Skip to content
      </a>
      <Header theme={theme} onToggleTheme={toggleTheme} />
      <main id="main">
        <Hero />
        <FactStrip />
        <ProfileSection />
        <EducationSection />
        <TrainingSection />
        <ProjectsSection />
        <SkillsSection />
        <ActivitiesSection />
        <ContactSection />
      </main>
      <Footer />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
